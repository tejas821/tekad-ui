name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege by default (docs/architecture/06-ci-quality-gates.md).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          # nx affected needs history to diff against the base.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          # Read from package.json "engines" so the floor lives in one place.
          node-version-file: package.json
          cache: pnpm

      # Gate 1 — install from the committed lockfile, or fail.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Every guard below is self-tested first. A gate that cannot fail is not
      # a gate — the boundary rule and the licence audit were both found to be
      # vacuous or wrong on their first implementation, and only a self-test
      # caught it. This step runs those self-tests.
      - name: Self-test the CI guards
        run: pnpm run verify:gates

      # Spike B gate — the deprecated webpack builder must not be in the tree.
      # It is an optional peer of @nx/angular and of some test runners, so its
      # absence is asserted rather than assumed. See ADR-012.
      - name: No deprecated webpack builder
        run: pnpm run verify:no-webpack-builder

      # Gate 10 (part) — dependency policy at DECLARATION time. The eslint
      # boundary rule provably cannot see an import of a package that is not
      # installed, so this catches the moment the decision is actually made.
      - name: Dependency policy
        run: pnpm run verify:deps

      # Spike B: a relative import across an entry-point boundary fails the
      # ng-packagr build with an internal crash rather than a readable error.
      # This produces the readable one first.
      - name: Entry-point boundaries
        run: pnpm run verify:entrypoints

      # ADR-007 decision 6 — contrast is a BUILD-TIME assertion, not a review
      # habit. Every semantic pair is checked in both schemes, because checking
      # a palette once in light mode and deriving dark by inverting the ramp is
      # exactly how a pair that cleared 4.5:1 on white ends up at 3.9:1 on
      # near-black with nobody noticing. Also verifies the committed token
      # output is current.
      - name: Colour contrast (WCAG 2.2 AA)
        run: pnpm run verify:contrast

      # ADR-005 decided TEKAD owns the floating layer and its own live announcer
      # on the strength of two facts about @angular/aria. Either could change in
      # a PATCH release — and if Aria gains a live announcer, the right response
      # is to DELETE TEKAD's, not maintain a duplicate. A failure here means an
      # ADR needs rereading, not that something is broken.
      - name: ADR-005 assumptions still hold
        run: pnpm run verify:aria

      # ADR-013 claimed Angular forbids implementing both ControlValueAccessor
      # and FormValueControl. It does not — measured in 22.1.4, it silently
      # prefers the CVA and the signal-forms value model never binds. There is
      # no framework error here, so this gate is the ONLY thing that catches a
      # control which compiles, boots, renders and does not work.
      - name: Forms contracts
        run: pnpm run verify:forms-contracts

      # Gate 2
      - name: Format check
        run: pnpm run format:check

      - name: Set nx base/head
        uses: nrwl/nx-set-shas@v4

      # Gates 3, 4, 5, 8 — scoped to affected projects.
      # Nx REMOTE CACHING IS DELIBERATELY NOT USED. ADR-012: the self-hosted
      # remote caches were withdrawn over CVE-2025-36852 (CREEP), whose threat
      # model is an open-source repo taking fork PRs — a PR modifies the
      # workflow, the workflow is not in the cache key, and the cache is
      # poisoned for later legitimate builds. That is this project exactly.
      - name: Lint
        run: pnpm exec nx affected -t lint --parallel=3

      - name: Typecheck
        run: pnpm exec nx affected -t typecheck --parallel=3

      - name: Test
        run: pnpm exec nx affected -t test --parallel=3

      # `nx affected -t test` above runs the suites that exist. This asserts
      # that the suites that exist are the ones on disk. `@nx/angular:unit-test`
      # discovers specs by glob against the project SOURCE ROOT, so a secondary
      # entry point added outside those patterns is skipped in silence and the
      # run stays green. Measured both ways: an over-broad `../**` pulled one
      # package's specs into another's build (loud), and the opposite slip says
      # nothing at all.
      - name: Every spec is actually run
        run: pnpm run verify:test-discovery

      # And that the suites are load-bearing. Deleting the one line that makes a
      # repeated live-region announcement audible still leaves nine of the
      # announcer's eleven tests green — "the suite passes" was never the
      # interesting fact. Each mutant is a plausible defect paired with the test
      # that must catch it; a surviving mutant fails the build.
      #
      # NOT run under `affected`: it edits source files, and the set it edits is
      # its manifest's, not the diff's.
      - name: Tests fail when the code is wrong
        run: pnpm run verify:mutation

      - name: Build
        run: pnpm exec nx affected -t build --parallel=3

      # Gate 9 — package validation, run against the BUILT output. What the
      # source says is an intention; what dist/ says is what a consumer gets.
      # This is what catches a library accidentally built in FULL compilation
      # mode, which ng-packagr otherwise only blocks at publish time.
      - name: Package format
        run: pnpm run verify:packages

      # Gate 11 — ADR-004: tree-shaking is verified by a probe app, never
      # assumed. Every scenario asserts a presence as well as an absence, so a
      # probe that has stopped measuring anything fails rather than passes.
      - name: Tree-shaking probe
        run: pnpm run verify:treeshaking

      # The one numeric budget that exists before Phase 9, because ADR-007
      # already states it: ~2 KB gzip for the theme sheet, ~1 KB for the
      # light-dark() fallback. Growth here is almost always a variant axis that
      # has become a selector.
      - name: Theme CSS budget
        run: pnpm run verify:css-budget

      # ADR-007's closing obligation: "Emulated-encapsulation SSR cost must be
      # measured before Phase 9." It was, and the answer inverted the
      # assumption — the `_ngcontent` attribute costs +87.7% raw and NOTHING
      # after compression (gzip is 4.8% smaller with it than without). The cost
      # is the component instance: a component per cell is +51% brotli. This
      # gate holds both numbers to a budget, and enforces the ShadowDom ban
      # that ADR-007 decision 8 rests the whole ARIA IDREF model on.
      - name: SSR encapsulation cost
        run: pnpm run verify:ssr

      # Accessibility verified BEHAVIOURALLY in a real browser, not by counting
      # attributes (CLAUDE.md Definition of Done). A live region that is
      # display:none is removed from the accessibility tree and announces
      # nothing — only a real layout can tell you it is still rendered.
      - name: Live announcer contract
        run: pnpm run verify:a11y

      # The Phase 9 slice, in a real browser. Everything jsdom cannot host:
      # computed colour, layout, focus, cascade layers, forced colours.
      #
      # These gates have already earned their place. Written the obvious way, the
      # button's CSS used `.tk-button` selectors — which Angular rewrites to
      # `.tk-button[_ngcontent-…]`, an attribute stamped on elements INSIDE a
      # component's template. The component's own host element carries
      # `_nghost-…` instead, so for a component that decorates an element the
      # consumer wrote, not one rule matched. The unit suite was green; the
      # button was 21px tall and wearing the UA's default grey.
      # Four gates: button, checkbox, input+field, dialog. Between them they
      # cover everything jsdom cannot host — computed colour, layout, focus,
      # cascade layers, forced colours, the top layer.
      #
      # The dialog gate answers an ADR-010 question that had been open since
      # Phase 6: showModal() supplies the focus trap, the background inertness,
      # aria-modal, Escape and focus restoration, so TEKAD writes none of it.
      # Measured — Tab pressed 12 times, Shift+Tab 6, focus followed the whole
      # way — rather than inferred from a support table.
      - name: Slice components in a real browser
        run: pnpm run verify:slice

      # The deferred-close state machine, proved deterministically against the
      # BUILT package. EVIDENCE CLASS: DEFENSIVE / SIMULATED — no browser was
      # ever observed delivering `toggle` synchronously, and none is claimed to.
      # The control shows the pre-fix ordering recursing without bound, so the
      # proof is not vacuous.
      - name: Overlay lifecycle
        run: pnpm run verify:overlay

      # Re-measures what Angular actually does with both forms contracts on one
      # control. If a future Angular starts REJECTING the combination, this
      # fails — and ADR-013's correction should then be revisited.
      - name: ADR-013 forms behaviour
        run: pnpm run verify:forms

  # Gates 12 and 13 run separately so a vulnerability or licence finding is
  # legible on its own rather than buried in a build log.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Two scopes, like the licence gate. `pnpm audit` exits non-zero whenever
      # it finds anything, so the reports are captured and verify-audit.mjs
      # decides the outcome. Lowering --audit-level is never the fix: it
      # disables the gate for everything.
      - name: Vulnerability audit
        run: |
          mkdir -p .nx
          pnpm run verify:audit

      # Two scopes: a forbidden licence in the PRODUCTION tree is fatal with no
      # exception path; in build tooling it needs a recorded justification.
      - name: Licence audit
        run: pnpm run verify:licences
