name: Release to npm

# Publishes every @tekad/* package from dist/ with npm provenance.
#
# How to release:
#   1. node tools/set-version.mjs 0.2.0      (bumps all packages + peer ranges)
#   2. commit, then: git tag v0.2.0 && git push origin main --tags
#   The tag must match the package versions or the job stops.
#
# Auth, in order of preference:
#   1. npm trusted publishing (OIDC): each package on npmjs.com is linked to
#      this repository + release.yml; no secret needed.
#   2. The NPM_TOKEN repository secret (a granular npm token with publish
#      rights on @tekad). npm cannot publish a package's FIRST version via
#      OIDC, so the token covers the first release; once every package is
#      linked to trusted publishing, delete the secret and revoke the token.
# Versions that already exist on npm are skipped, so a re-run is safe.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: npm with trusted-publishing support
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          bad=0
          for f in packages/*/package.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$want" ]; then echo "::error file=$f::version $v does not match tag $GITHUB_REF_NAME"; bad=1; fi
          done
          exit $bad

      - name: Test
        run: pnpm exec nx run-many -t test

      - name: Build
        run: pnpm exec nx run-many -t build --skip-nx-cache

      - name: Verify packages
        run: node tools/verify-package-format.mjs && node tools/verify-consumer-boundary.mjs

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Foundation first so dependants never point at a missing peer.
          order="core theme overlay forms"
          for d in dist/packages/*/; do
            n=$(basename "$d"); case " $order " in *" $n "*) ;; *) order="$order $n";; esac
          done
          for n in $order; do
            dir="dist/packages/$n"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already on npm)"
              continue
            fi
            echo "publish $name@$version"
            (cd "$dir" && npm publish --access public --provenance)
          done
