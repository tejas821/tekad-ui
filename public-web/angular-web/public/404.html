<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>TEKAD UI</title>
  <script>
    // GitHub Pages SPA fallback: redirect to index.html preserving the path
    // so Angular's client-side router can handle it.
    var pathSegmentsToKeep = 1; // repo name is one segment deep
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
