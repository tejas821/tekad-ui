<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TEKAD UI — Angular Component Library</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="TEKAD UI — A production-grade Angular 22 component library. Signals-canonical, accessibility-verified, behaviourally tested." />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  
  <style>
    /* CRITICAL CSS - INLINED FOR INSTANT RENDER */
    :root {
      --tk-surface: #ffffff;
      --tk-on-surface: #0f1117;
      --tk-surface-variant: #f5f6f8;
      --tk-primary: #2b5cee;
      --tk-on-primary: #ffffff;
      --tk-secondary: #7c3aed;
      --tk-accent: #06b6d4;
      --tk-outline: #d1d5db;
      --tk-outline-variant: #e5e7eb;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tk-surface);
      color: var(--tk-on-surface);
      line-height: 1.6;
      min-height: 100vh;
    }
    
    /* Loading skeleton */
    .app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--tk-surface);
      z-index: 9999;
    }
    
    .app-loading__spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--tk-outline-variant);
      border-top-color: var(--tk-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .app-loading__text {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: var(--tk-on-surface);
      opacity: 0.6;
    }
    
    /* Hide loading when app bootstraps */
    app-root:not(:empty) + .app-loading {
      display: none;
    }
  </style>
  <script>
    // GitHub Pages SPA redirect handler
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
</head>
<body>
  <app-root></app-root>
  <div class="app-loading">
    <div style="text-align: center;">
      <div class="app-loading__spinner"></div>
      <div class="app-loading__text">Loading TEKAD UI...</div>
    </div>
  </div>
</body>
</html>
